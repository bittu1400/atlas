# Pre-commit configuration for Atlas (ADR-0014 §4)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Lint Check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: Ruff Format Check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]

      - id: anti-fabrication-guard
        name: Anti-Fabrication Structural Guard
        entry: uv run pytest tests/unit/test_no_fabrication.py -q
        language: system
        pass_filenames: false
        always_run: true
