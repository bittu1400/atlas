# Alembic configuration for Atlas

[alembic]
script_location = packages/atlas/src/atlas/adapters/persistence/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = . packages/atlas/src
timezone = UTC
path_separator = os
version_path_separator = os

# Default database sync url
sqlalchemy.url = postgresql+psycopg://postgres@localhost:5432/atlas

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
